version: '3.9'

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: elms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       elms_db
      POSTGRES_USER:     elms_user
      POSTGRES_PASSWORD: elms_pass
    ports:
      - "5433:5432"   # host 5433 → container 5432; avoids conflict with local PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elms_user -d elms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elms_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL:       jdbc:postgresql://db:5432/elms_db
      DB_USERNAME:  elms_user
      DB_PASSWORD:  elms_pass
      JWT_SECRET:   change-me-in-production-very-long-secret-key-256bits
      CORS_ORIGINS: http://localhost:3000
      MAIL_HOST:    mailhog
      MAIL_PORT:    1025
      MAIL_USERNAME: noreply@elms.com
      MAIL_PASSWORD: ""
    ports:
      - "8082:8080"   # host 8082 → container 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ── React Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:8082/api
    container_name: elms_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  # ── MailHog (dev mail catcher) ──────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: elms_mailhog
    restart: unless-stopped
    ports:
      - "1026:1025"   # SMTP (host 1026 → container 1025; avoids conflicts)
      - "8025:8025"   # Web UI

volumes:
  postgres_data:
